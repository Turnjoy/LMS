{% extends "base.html" %}

{% block title %}{{ error_code }} - {{ tenant_domain or 'School LMS' }}{% endblock %}

{% block content %}
<section class="card" style="max-width: 720px; margin: 40px auto;">
    <p style="font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--primary-color);">{{ error_code }}</p>
    <h1>{{ error_title }}</h1>
    <p style="color: #666; margin: 10px 0 18px;">This request stayed inside {{ tenant.name if tenant else 'the tenant portal' }}.</p>
    <a href="{{ url_for('public.index') }}" class="btn btn-primary">Portal Home</a>
</section>
{% endblock %}
